name: deploy-www

on:
  push:
    branches:
      - dev
      - production
  workflow_dispatch:

concurrency:
  group: deploy-www-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'anomalyco/opencode' && (github.ref_name == 'dev' || github.ref_name == 'production')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Build
        working-directory: services/www
        run: bun run build
        env:
          CLOUDFLARE_ENV: ${{ github.ref_name == 'production' && 'production' || 'dev' }}

      - name: Deploy
        working-directory: services/www
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
